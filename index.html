 <!DOCTYPE html>
<html>
<head>
  <title>Barber Content AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>💈 Barber Content AI</h1>

<p>What do you want content about?</p>

<textarea id="idea" placeholder="Example: I want more fade clients"></textarea>

<button onclick="generateContent()">Generate Content</button>

<div id="result"></div>

<script>
function generateContent() {
  const idea = document.getElementById("idea").value;

  if (idea.trim() === "") {
    document.getElementById("result").innerText =
      "Please type something first!";
    return;
  }

  const result = `
🔥 CONTENT IDEAS

1. Show a before-and-after transformation
2. Show your cleanest fade of the week
3. Explain 3 mistakes people make when getting a fade

🎬 VIDEO HOOKS

"Your fade might look bad because of THIS..."

"Here's what a great haircut should look like."

"3 things your barber wants you to know."

✍️ CAPTION

Want a cleaner fade?
Book your next appointment and let's get you right 🔥

#barber #fade #barbershop #haircut #menshair
`;

  document.getElementById("result").innerText = result;
}
</script>

</body>
</html>
